services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: yamoyo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "app-server:172.31.3.153"

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: yamoyo-mysqld-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      DATA_SOURCE_NAME: "exporter:exporterPass2026@tcp(yamoyo-perf-db.cr6gseyiqqby.ap-northeast-2.rds.amazonaws.com:3306)/"
    command:
      - "--collect.info_schema.innodb_metrics"
      - "--collect.info_schema.processlist"
      - "--collect.perf_schema.tableiowaits"
      - "--collect.engine_innodb_status"

  grafana:
    image: grafana/grafana:11.5.2
    container_name: yamoyo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: yamoyo2026
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  prometheus-data:
  grafana-data: