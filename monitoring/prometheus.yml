global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "spring-boot"
    metrics_path: "/api/actuator/prometheus"
    static_configs:
      - targets: ["app-server:8080"]
        labels:
          app: "yamoyo"

  - job_name: "mysqld"
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels:
          db: "yamoyo-perf-db"